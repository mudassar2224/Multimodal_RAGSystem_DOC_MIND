[project]
name = "docmind"
version = "0.1.0"
description = "Hosted, persistent multimodal RAG for documents and media"
authors = [
    { name = "Muhammad Mudassar", email = "m.mudassar224@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.97",
    "httpx>=0.28.1",
    "huggingface-hub>=1.32.0",
    "imageio-ffmpeg>=0.6.0",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.0.54",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
ignore_missing_imports = true

[project.scripts]
docmind = "docmind:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
